<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball Trading Cards | Packs</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header id="headerTem"></header>
    <main>
      <div class="hero">
        <img
          src="../images/btc_banner-sm.png"
          srcset="../images/btc_banner-sm.png 500w, ../images/btc_banner.png"
          alt="Stadium"
        />
      </div>
      <h1 class="packsTitle">BUY PACKS</h1>
      <div id="packs">
        <section class="packsSection">
            <img
              src="../images/btc_20packs.png"
              alt="20 Packs"
            />
            <p>20 Cards Pack</p>
            <div class="buypack">
                <p>$50.00</p>
                <button class="btnPacks" id="add20pack">Add to Cart</button>
            </div>
        </section>
        <section class="packsSection">
            <img
              src="../images/btc_10packs.png"
              alt="10 Packs"
            />
            <p>10 Cards Pack</p>
            <div class="buypack">
                <p>$28.00</p>
                <button class="btnPacks" id="add10pack">Add to Cart</button>
            </div>
        </section>
        <section class="packsSection">
            <img
              src="../images/btc_5packs.png"
              alt="5 Packs"
            />
            <p>5 Cards Pack</p>
            <div class="buypack">
                <p>$15.00</p>
                <button class="btnPacks" id="add5pack" >Add to Cart</button>
            </div>
        </section>
        <section class="packsSection">
            <img
              src="/images/btc_3packs.png"
              alt="3 Packs"
            />
            <p>3 Cards Pack</p>
            <div class="buypack">
                <p>$8.00</p>
                <button class="btnPacks" id="add3pack">Add to Cart</button>
            </div>
        </section>
      </div>  
    </main>
    <footer id="footerTem"></footer>
  </body>
  <script type="module" src="../js/buyPacks.js"></script>
</html>
