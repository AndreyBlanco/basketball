<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Basketball</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <script src="../js/player.js" type="module"></script>
  </head>

  <body>
    <header id="headerTem"></header>

    <main class="divider">
      <h1 class="mainTitle">CARD DESCRIPTION</h1>
      <div id="playerInfo">
        <section class="player-detail">
          <h2>Player Info:</h2>
          <img id="playerImage" src="" alt="" />
          <h1 id="playerFirstname"></h1>
          <p id="playerTeam"></p>
          <img id="teamImage" src="" alt="" />
          <p id="playerHeight"></p>
          <p id="playerWeight"></p>
          <p id="playerBirthDate"></p>
          <p id="playerBirthCity"></p>
          <p id="playerCollege"></p>
          <p id="playerSalary"></p>
          <button class="btns" id="addToSell" data-id="" onclick="location.href='../sellcards/index.html'">Add to Sell List</button>
          <button class="btns" id="addToTrade" data-id="" onclick="location.href='../tradecards/index.html'">Add to Trade List</button>
        </section>
        <section class="player-info">
          <h2>Data & Stadistics:</h2>
          <div id="stTable"></div>
          <div id="news"></div>
        </section>
      </div>
    </main>

    <footer id="footerTem"></footer>
  </body>
</html>
