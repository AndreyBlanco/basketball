<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball Trading Cards | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header id="headerTem"></header>
    <main>
      <div class="hero">
        <img
          src="/images/btc_banner-sm.png"
          srcset="images/btc_banner-sm.png 500w, images/btc_banner.png"
          alt="Stadium"
        />
      </div>
      <div id="offers">
        <section class="offerSection">
          <img
            src="/images/btc_packs.png"
            alt="Packs"
          />
          <p>Special Packs</p>
          <ul class="specialPack-list"></ul>
        </section>
        <section class="offerSection">
          <img
            src="/images/btc_buy.png"
            alt="Buy Cards"
          />
          <p>Buy Cart Offers</p>
          <ul class="specialBuy-list"></ul>
        </section>
        <section class="offerSection">
          <img
            src="/images/btc_trade.png"
            alt="Trade Cards"
          />
          <p>Trade Card Offers</p>
          <ul class="specialTrade-list"></ul>
        </section>
      </div>
    </main>
    <footer id="footerTem"></footer>
  </body>
  <script type="module" src="js/main.js"></script>
</html>
